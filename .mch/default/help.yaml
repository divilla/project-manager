version: 1

task_modes:
  - slug: editor
    help: task will open the configured editor
  - slug: exec
    help: task will run an automated agent with the configured prompt
  - slug: prompt
    help: task will open an interactive agent session
  - slug: script
    help: task will execute the configured script
  - slug: loop
    help: task will repeat from its target until its condition matches

task_statuses:
  - slug: queued
    help: task is waiting to start
  - slug: running
    help: task is actively executing
  - slug: paused
    help: task is temporarily paused
  - slug: stopped
    help: task was manually stopped
  - slug: waiting
    help: task is waiting for input
  - slug: completed
    help: task finished successfully
  - slug: failed
    help: task finished with an error

task_steps:
  - slug: none
    help: task has not started yet
  - slug: entry
    help: entry script is executing
  - slug: prompt
    help: prompt is being prepared or shown
  - slug: agent
    help: automated agent is executing
  - slug: exit
    help: exit script is executing
  - slug: done
    help: task has finished
