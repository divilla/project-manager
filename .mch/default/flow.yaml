version: 1
slug: default
name: Default Change Automation
description: Default repository Flow for moving a Change from idea capture through master promotion.

help: help.yaml
makefile: Makefile

steps:
  - slug: idea-write
    stage: idea
    help: rewrite the idea
    mode: exec
    prompt: prompts/idea-write.md

  - slug: idea-review
    stage: idea
    help: review the idea
    mode: exec
    prompt: prompts/idea-review.md

  - slug: idea-chat
    stage: idea
    help: capture or refine the initial change idea
    mode: chat

  - slug: spec-write
    stage: idea
    help: write the spec
    mode: exec
    prompt: prompts/spec-write.md

  - slug: pr-write
    stage: idea
    help: write the pull request
    mode: exec
    prompt: prompts/pr-write.md

  - slug: spec-review
    stage: spec-review
    help: review the spec
    mode: exec
    prompt: prompts/spec-review.md

  - slug: spec-review-chat
    stage: spec-review
    help: review the spec chat
    mode: chat
