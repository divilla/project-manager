version: 1
slug: default
name: Default Change Automation
description: Default repository Flow for moving a Change from idea capture through master promotion.

help: help.yaml
makefile: Makefile

stages:
  - slug: plan
    steps:
      - slug: idea
        help: capture or refine the initial change idea
        tasks:
          - slug: idea-edit
            help: rewrite idea for readability
            mode: editor
          - slug: idea-rewrite
            help: rewrite idea for readability
            mode: exec
            prompt: prompts/idea-rewrite.md
            expect: Done.
          - slug: idea-review
            help: rewrite and clarify idea
            mode: exec
            prompt: prompts/idea-review.md
          - slug: idea-loop
            mode: loop
            to: idea-review
            until: No questions or suggestions.
      - slug: spec
        help: create the implementation-ready spec
        tasks:
          - slug: spec-write
            help: write specification following ideas
            mode: exec
            prompt: prompts/spec-write.md
            expect: Done.
          - slug: spec-review
            help: verify, review and clarify idea
            mode: exec
            prompt: prompts/spec-review.md
          - slug: spec-loop
            mode: loop
            to: spec-review
            until: No blocking issues found.

  - slug: implement
    steps:
      - slug: init
        tasks:
          - slug: init-branch
            help: update required documentation before implementation
            mode: script
            script: scripts/init-branch.sh
            args:
              - change.slug
          - slug: init-idea-file
            help: write the Change specification to the repository
            mode: script
            script: scripts/init-idea-file.sh
            stdin: change.idea
          - slug: init-spec-file
            help: write the Change specification to the repository
            mode: script
            script: scripts/init-spec-file.sh
            stdin: change.spec
      - slug: docs
        tasks:
          - slug: docs-update
            help: update required documentation before implementation
            mode: exec
            prompt: prompts/docs-update.md
      - slug: code
        tasks:
          - slug: code-implement
            help: update required documentation before implementation
            mode: exec
            prompt: prompts/code-implement.md
          - slug: code-polish
            help: update required documentation before implementation
            mode: prompt
            prompt: prompts/code-polish.md
      - slug: pr
        tasks:
          - slug: pr-write
            help: update required documentation before implementation
            mode: exec
            prompt: prompts/pr-write.md
          - slug: pr-publish
            help: update required documentation before implementation
            mode: script
            script: scripts/pr-publish.sh

  - slug: review
    help: review the PR/change against the spec
    steps:
      - slug: code
        tasks:
          - slug: code-review
            mode: exec
            prompt: prompts/code-review.md
            help: update required documentation before implementation
          - slug: code-review-publish
            help: update required documentation before implementation
            mode: script
            script: scripts/pr-comment-publish.sh
            stdin: finding
          - slug: code-loop
            mode: loop
            to: code-review
            until: No blocking issues found.
      - slug: docs-specs
        tasks:
          - slug: finalize-docs
            mode: exec
            prompt: prompts/finalize-docs-spec.md
            help:
            expect: Done.

  - slug: deploy
    help: review the PR/change against the spec
    steps:
      - slug: stage
        tasks:
          - slug: merge-stage
            help: merge to stage branch
            mode: script
            script: scripts/merge-stage.sh
      - slug: production
        tasks:
          - slug: deploy-master
            help:
            mode: script
            script: scripts/deploy-master.sh
